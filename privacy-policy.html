<head>

  <style>
    :root {
      color-scheme: light dark;
      --policy-text: #172033;
      --policy-muted: #5f6f8f;
      --policy-card: rgba(255, 255, 255, 0.82);
      --policy-border: rgba(74, 105, 255, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--policy-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      background:
        radial-gradient(circle at 10% 12%, rgba(38, 198, 218, 0.24), transparent 28rem),
        radial-gradient(circle at 88% 10%, rgba(108, 99, 255, 0.22), transparent 30rem),
        #f6f8ff;
    }
    body[dir="rtl"] { text-align: right; }
    .wrapper { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .brand-link { display: inline-flex; align-items: center; gap: 10px; color: var(--policy-text); font-weight: 800; text-decoration: none; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; color: #07111f; background: linear-gradient(135deg, #26c6da, #ffb86b); }
    .language-picker { display: inline-flex; align-items: center; gap: 8px; color: var(--policy-muted); }
    .language-picker select { max-width: 180px; padding: 8px 12px; border: 1px solid var(--policy-border); border-radius: 999px; color: var(--policy-text); background: var(--policy-card); font: inherit; }
    .content-card { padding: clamp(22px, 4vw, 44px); border: 1px solid var(--policy-border); border-radius: 32px; background: var(--policy-card); box-shadow: 0 24px 70px rgba(25, 35, 80, 0.16); backdrop-filter: blur(18px); }
    .content-card h2 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.05; }
    .content-card > p { color: var(--policy-muted); }
    .policy-content { display: grid; gap: 14px; margin-top: 28px; }
    .policy-section { padding: 18px 20px; border: 1px solid var(--policy-border); border-radius: 20px; background: rgba(255, 255, 255, 0.48); }
    .policy-section h3 { margin: 0 0 6px; font-size: 1.06rem; }
    .policy-section div { color: var(--policy-muted); }
    @media (prefers-color-scheme: dark) {
      :root { --policy-text: #f3f7ff; --policy-muted: #a9b6ce; --policy-card: rgba(12, 20, 36, 0.78); --policy-border: rgba(143, 196, 255, 0.18); }
      body { background: radial-gradient(circle at 10% 12%, rgba(38, 198, 218, 0.18), transparent 28rem), radial-gradient(circle at 88% 10%, rgba(108, 99, 255, 0.18), transparent 30rem), #08111f; }
      .policy-section { background: rgba(12, 20, 36, 0.48); }
    }
    @media (max-width: 680px) {
      .wrapper { width: min(100% - 24px, 1080px); padding-top: 18px; }
      .top-bar { align-items: flex-start; flex-direction: column; }
      .language-picker { width: 100%; justify-content: space-between; }
      .language-picker select { max-width: 58vw; }
    }
  </style>

    function normalizedLanguage(value) { if (!value) return 'en'; if (value.startsWith('zh-Hans') || value === 'zh-CN' || value === 'zh-SG') return 'zh-Hans'; if (value.startsWith('zh-Hant') || value === 'zh-TW' || value === 'zh-HK' || value === 'zh-MO') return 'zh-Hant'; const base = value.split('-')[0]; return supported.includes(base) ? base : 'en'; }
    function renderPolicy(sections) { document.getElementById('policyContent').innerHTML = sections.map(([heading, body]) => `<section class="policy-section"><h3>${heading}</h3><div>${body}</div></section>`).join('\n'); }
    function applyLanguage(lang) { const selected = normalizedLanguage(lang); const data = translations[selected]; document.documentElement.lang = selected; document.documentElement.dir = selected === 'ar' ? 'rtl' : 'ltr'; document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = data[el.dataset.i18n] || translations.en[el.dataset.i18n]; }); renderPolicy(data.sections); document.getElementById('languageSelect').value = selected; localStorage.setItem('infmazeLanguage', selected); }
    document.getElementById('languageSelect').addEventListener('change', event => applyLanguage(event.target.value));
